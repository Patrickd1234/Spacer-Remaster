<div>
<h2 class="font-headline-md text-headline-md text-on-surface font-bold">Create New Task</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Assign work to the Spacers project team</p>
</div>

<span class="material-symbols-outlined text-on-surface-variant group-hover:text-on-surface">close</span>

</div>
<!-- Modal Content (Scrollable Form) -->
<form class="p-lg space-y-lg max-h-[70vh] overflow-y-auto custom-scrollbar">
<!-- Task Name -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-primary-container" for="task-name">Task Name</label>
<div class="relative group">
<input class="w-full bg-[#101509] border border-outline-variant rounded-lg px-md py-md font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="task-name" placeholder="e.g., Implement Auth Flow" type="text">
<div class="absolute right-md top-1/2 -translate-y-1/2 opacity-0 group-focus-within:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-primary-container text-[18px]">edit_note</span>
</div>
</div>
</div>
<!-- Task Description -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="task-desc">Task Description</label>

<div class="flex justify-between items-center px-xs">
<div class="flex gap-sm">

<span class="material-symbols-outlined text-[18px]">attach_file</span>
</button>
<button class="text-on-surface-variant hover:text-primary-container transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">format_list_bulleted</span>
</button>
<button class="text-on-surface-variant hover:text-primary-container transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">link</span>
</button>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant/50">Markdown supported</span>
</div>
</div>

</button>

                        Cancel

                        Create Task
                    </button>
</div>
</div>

<!-- Micro-interactions Script -->
<script>
        // Modal Entrance Animation
        document.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('modal-overlay');
            const modal = overlay.querySelector('div');
            
            // Subtle hover effect on inputs
            const inputs = document.querySelectorAll('input, textarea');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    input.parentElement.classList.add('scale-[1.01]');
                });
                input.addEventListener('blur', () => {
                    input.parentElement.classList.remove('scale-[1.01]');
                });
            });
        });

        // Close logic mock
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                if(btn.textContent.trim() === 'Cancel' || btn.querySelector('.material-symbols-outlined')?.textContent === 'close') {
                    document.getElementById('modal-overlay').classList.add('opacity-0', 'pointer-events-none');
                }
                if(btn.textContent.trim() === 'Create Task') {
                    btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Creating...';
                    setTimeout(() => {
                        document.getElementById('modal-overlay').classList.add('opacity-0', 'pointer-events-none');
                    }, 800);
                }
            });
        });
    </script>
