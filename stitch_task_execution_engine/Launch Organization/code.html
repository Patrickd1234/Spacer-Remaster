<script>
        // Simple micro-interaction for the launch button
        const launchBtn = document.querySelector('button[type="submit"]');
        launchBtn.addEventListener('click', (e) => {
            e.preventDefault();
            launchBtn.innerHTML = `
                <span class="material-symbols-outlined animate-spin">sync</span>
                <span class="font-headline-md text-headline-md">Initializing Mission...</span>
            `;
            setTimeout(() => {
                launchBtn.innerHTML = `
                    <span class="material-symbols-outlined">check_circle</span>
                    <span class="font-headline-md text-headline-md">System Ready</span>
                `;
                launchBtn.classList.remove('bg-primary-fixed');
                launchBtn.classList.add('bg-on-surface', 'text-background');
            }, 2000);
        });

        // Add focus effect to the form inputs
        const inputs = document.querySelectorAll('input, textarea');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.closest('.space-y-xs').querySelector('label').classList.replace('text-on-surface-variant', 'text-primary-fixed');
            });
            input.addEventListener('blur', () => {
                input.parentElement.closest('.space-y-xs').querySelector('label').classList.replace('text-primary-fixed', 'text-on-surface-variant');
            });
        });
    </script>
