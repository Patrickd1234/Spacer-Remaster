<!doctype html>
<html class="dark" data-theme="dark" data-color-scheme="dark" data-accent="lime" lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Spacers | Dashboard</title>
  <script>
    (() => {
      const root = document.documentElement;
      try {
        const cached = JSON.parse(localStorage.getItem("spacers:appearance:v1:guest") || "null");
        const appearance = cached?.version === 1 ? cached.appearance : null;
        if (typeof appearance?.theme === "string" && appearance.theme.length <= 32) {
          root.dataset.theme = appearance.theme;
        }
        if (typeof appearance?.accentColor === "string" && appearance.accentColor.length <= 24) {
          root.dataset.accent = appearance.accentColor;
        }
      } catch {
        // The default dark palette remains active when local storage is unavailable.
      }

      const systemTheme = window.matchMedia?.("(prefers-color-scheme: light)");
      const applyColorScheme = () => {
        const isLight = root.dataset.theme === "light" || (root.dataset.theme === "system" && systemTheme?.matches);
        root.dataset.colorScheme = isLight ? "light" : "dark";
        root.classList.toggle("light", isLight);
        root.classList.toggle("dark", !isLight);
      };
      applyColorScheme();
      systemTheme?.addEventListener?.("change", () => {
        if (root.dataset.theme === "system") applyColorScheme();
      });
    })();
  </script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    rel="stylesheet">
