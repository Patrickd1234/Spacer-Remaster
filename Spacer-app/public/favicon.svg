<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- The Spacer rocket (same drawing as src/components/RocketLogo.jsx) for the
       browser tab. Colours follow the computer's light or dark setting so it
       stays visible on either tab bar. -->
  <style>
    .rock { fill: #8A8F9A; stroke: #6B707B; }
    .body { fill: #4A5060; }
    .window { fill: #F4F2EC; }
    @media (prefers-color-scheme: dark) {
      .rock { fill: #6B707B; stroke: #8A8F9A; }
      .body { fill: #D3D7DF; }
      .window { fill: #1C1F26; }
    }
  </style>
  <g class="rock" stroke-width="1" stroke-linejoin="round">
    <path d="M3 9 L7 5.5 L12 8 L11.5 13 L5.5 13.5 Z" />
    <path d="M36 37 L40.5 33.5 L45.5 37.5 L43 43 L37 42 Z" />
    <path d="M38.5 7.5 L42 5.5 L44.5 8.5 L42 11 Z" />
    <path d="M4 37 L7.5 35 L10 38 L7 40.5 Z" />
    <circle cx="44" cy="22.5" r="1.8" />
  </g>
  <g transform="rotate(40 24 24)">
    <path class="body" d="M24 6 C29 11 31 18 30 28 L18 28 C17 18 19 11 24 6 Z" />
    <path class="body" d="M18 21 L13 30 L18 29 Z M30 21 L35 30 L30 29 Z" opacity="0.75" />
    <circle class="window" cx="24" cy="17" r="3" />
    <rect class="body" x="20" y="28" width="8" height="2.5" rx="1" opacity="0.6" />
    <path d="M21 30.5 Q24 40 27 30.5 Z" fill="#F97316" />
    <path d="M22.5 30.5 Q24 36 25.5 30.5 Z" fill="#FACC15" />
  </g>
</svg>
