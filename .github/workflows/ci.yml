# Runs on every push and pull request: unit tests, production build, edge
# function type check. Lint is reported but doesn't fail the run yet, because
# the code base has older lint errors; make it blocking once those are fixed.
name: CI

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Spacer-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Spacer-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Lint (not blocking yet)
        run: npm run lint
        continue-on-error: true

  edge-functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Spacer-app/supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check every edge function
        run: deno check --node-modules-dir=none --no-config */index.ts
